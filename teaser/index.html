<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Is My Train Screwed? — Ask me.</title>
<meta name="description" content="A conversational NYC transit advisor. Ask me if your transfer, your flight, or your route is screwed.">
<link rel="icon" href="data:,">
<style>
  :root{
    --ink:#0a0a0a;
    --paper:#ffffff;
    --signal:#1472ff;
    --signal-ink:#ffffff;
    --roll-ms: 620ms;
    --roll-ease: cubic-bezier(.61,.06,.2,1);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                 "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    overflow-y:auto;
  }

  /* Mobile-first base: a stacked flow, no fixed canvas aspect. Headline
     and "Ask me." share one font-size (the source PDFs set both at the
     same 150pt). */

  .stage{
    min-height:100vh;
    min-height:100dvh;
    width:100%;
    /* the flex column + gap + padding used to live on .canvas -- moved
       here because .canvas is display:contents on mobile now (see
       below), so it can no longer render its own box/padding/gap. */
    display:flex;
    flex-direction:column;
    gap: clamp(14px, 3.2dvh, 26px);
    padding: clamp(18px, 5.5vw, 36px) clamp(20px, 6vw, 40px);
  }

  .canvas{
    /* still needed for desktop (see media query below), where display
       reverts to block and this becomes a real positioned box again */
    position:relative;
    /* contents: this element renders no box of its own on mobile -- its
       children (headline-viewport, ask-me, bubble-stage) become direct
       flex items of .stage instead, joining it in one shared flex/order
       context */
    display:contents;
  }

  .headline-viewport{
    order:1;
    overflow:hidden;
    /* required, not decorative: .headline-track below uses flex:0 0 500%,
       which only takes effect when its parent is a flex container. This
       was removed along with align-items:center/flex:1 1 auto in the
       spacing fix, but unlike those two, this one wasn't just about
       centering -- without it flex-basis:500% is a no-op and the track
       silently falls back to 100%-of-viewport width, collapsing every
       slide to a sliver (the exact "ellipsis after 3 characters" bug).
       align-items:center and flex:1 1 auto stay removed; only this. */
    display:flex;
  }
  .headline-track{
    list-style:none; margin:0; padding:0;
    display:flex;
    /* flex-shrink:0 is the actual fix -- min-width:0 alone just let the
       default flex-shrink:1 collapse this down to fit the viewport
       (1x width instead of the intended Nx), since nothing was left to
       stop it once its content-based minimum was zeroed out. shrink:0
       locks the basis for real.

       5 items (4 real + 1 clone of slide 1, appended at the end) so the
       track can always advance forward and never has to snap backward
       through the whole set to loop -- see the JS reset logic. */
    flex:0 0 500%; min-width:0;
    transform: translateX(0%);
  }
  @media (prefers-reduced-motion:no-preference){
    .headline-track{ transition: transform var(--roll-ms) var(--roll-ease); }
  }
  .headline-slide{
    /* min-width:0 overrides flexbox's default min-width:auto -- without
       it, the nowrap text below has a min-content width equal to its
       full unwrapped length, which silently wins over max-width:20% and
       lets the slide render wider than its slot, bleeding into the next
       slide's space (the exact bug: next title visible on the current
       one). flex-basis:20% + min-width:0 makes 20% actually stick. */
    flex:0 0 20%; max-width:20%; min-width:0;
    margin:0;
    display:flex;
    flex-direction:column;
    font-weight:700;
    letter-spacing:0.01em;
    /* generous enough that bold glyph descenders (g, y, p) never get
       clipped by .line's overflow:hidden below */
    line-height:1.22;
    /* sized with real margin: the longest real line ("catch up the
       transfer?", 23 chars) was overflowing its 1-line nowrap box at
       the previous larger size on ordinary phone widths, silently
       triggering the ellipsis fallback on real content, not just an
       edge case. This clamp keeps ~20px of slack at 360-430px widths. */
    font-size: clamp(1.4rem, 6.2vw, 2.1rem);
  }
  /* force exactly two lines: each line is its own block, never wraps
     further -- worst case (extreme narrow viewport) it ellipsizes
     instead of silently becoming a third line */
  .headline-slide .line{
    display:block;
    max-width:100%;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .ask-me{
    order:2;
    flex:none;
    margin:0;
    font-weight:700;
    letter-spacing:0.01em;
    /* same size as the headline, per the source PDF (both set at 150pt) */
    font-size: clamp(1.4rem, 6.2vw, 2.1rem);
    /* it's a real link to the MVP now -- same ink color as the rest of
       the headline (not the browser's default link blue), underlined so
       it still reads as clickable without changing the brand color. */
    color:inherit;
    text-decoration:underline;
  }
  .ask-me:focus-visible{
    outline:2px solid var(--signal);
    outline-offset:4px;
  }

  .bubble-stage{
    order:3;
    flex:none;
    width:100%;
    /* fixed, width-derived height -- matches the tallest of the four
       crops (the flight slide, whose reply text wraps to 3 lines) so no
       image is ever clipped; shorter-aspect slides just letterbox a bit
       within the same stable box instead of the zone's height jumping
       around between slides */
    aspect-ratio: 3129 / 1656;
  }
  .bubbles-viewport{ overflow:hidden; border-radius:14px; width:100%; height:100%; }
  .bubbles-track{
    list-style:none; margin:0; padding:0;
    display:flex; width:500%; min-width:0; height:100%;
    transform: translateX(0%);
  }
  @media (prefers-reduced-motion:no-preference){
    .bubbles-track{ transition: transform var(--roll-ms) var(--roll-ease); }
  }
  .bubble-slide{
    flex:0 0 20%; max-width:20%; min-width:0;
    height:100%;
  }
  .bubble-slide img{
    display:block;
    width:100%;
    height:100%;
    object-fit:contain;
  }

  /* ---------- desktop / landscape tier: true 16:10 canvas, positioned
     exactly per the source PDF's measured coordinates (1920x1200) via
     container-query units, so every offset and font-size scales as one
     unit with the canvas at any size. ---------- */

  @media (min-width: 760px){
    /* reset the mobile flex-column/gap/padding .stage picked up so
       .canvas (its only remaining real flex item) centers cleanly again */
    .stage{ display:flex; flex-direction:row; align-items:center; justify-content:center; gap:0; padding:0; }

    .canvas{
      container-type: inline-size;
      aspect-ratio: 1920 / 1200;
      width: min(100%, 100dvh * 1.6);
      max-height: 100dvh;
      display:block;
      padding:0;
      gap:0;
    }

    .headline-viewport{
      position:absolute;
      left:3.8%; top:4.75%;
      width:85%;
    }
    .headline-slide{
      font-size: 7.8125cqw;
      line-height:1.15;
    }

    .ask-me{
      position:absolute;
      left:3.8%; top:49.4%;
      font-size: 7.8125cqw;
    }

    .bubble-stage{
      position:absolute;
      left:38.8%; top:40.75%;
      width:52.2%; height:42.35%;
    }
    .bubbles-viewport{ border-radius:0; }
  }

  @media (max-height: 480px) and (max-width: 759px){
    .stage{ gap: clamp(10px, 3vh, 18px); padding: clamp(14px, 4vw, 24px); }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="canvas">
      <div class="headline-viewport">
        <ul class="headline-track" id="headlineTrack">
          <li class="headline-slide"><span class="line">Not sure if you can</span><span class="line">catch up the transfer?</span></li>
          <li class="headline-slide"><span class="line">Worried about sudden</span><span class="line">signal problems?</span></li>
          <li class="headline-slide"><span class="line">Traveling in subway</span><span class="line">with a wheelchair?</span></li>
          <li class="headline-slide"><span class="line">Woke up late for a</span><span class="line">morning flight?</span></li>
          <li class="headline-slide" aria-hidden="true"><span class="line">Not sure if you can</span><span class="line">catch up the transfer?</span></li>
        </ul>
      </div>

      <div class="bubble-stage">
        <div class="bubbles-viewport">
          <ul class="bubbles-track" id="bubblesTrack">
            <li class="bubble-slide">
              <img src="assets/bubbles-0.png" alt="Text exchange: Can I catch up the next M60 after getting off N? Reply: There is a 35% chance you miss the transfer. Take M then Q70 at Roosevelt Ave instead.">
            </li>
            <li class="bubble-slide">
              <img src="assets/bubbles-1.png" alt="Text exchange: My M train is indefinitely delayed, what should I do? Reply: Next best option now is to take Q102 to Court Sq, then N to Astoria Blvd, then M60.">
            </li>
            <li class="bubble-slide">
              <img src="assets/bubbles-2.png" alt="Voice message sent, 4 seconds. Reply: Avoid transferring at 59 St-Columbus Circle due to out-of-service elevators. Walk to 79 St station and take 1.">
            </li>
            <li class="bubble-slide">
              <img src="assets/bubbles-3.png" alt="Text exchange: Help my flight is an hour away at LGA and I'm at Koreatown. Reply: The fastest option is walk to Penn Station, board any of Long Beach, Ronkonkoma, Port Washington, or Babylon-bound LIRR, get off at Woodside and transfer to Q70.">
            </li>
            <li class="bubble-slide" aria-hidden="true">
              <img src="assets/bubbles-0.png" alt="" aria-hidden="true">
            </li>
          </ul>
        </div>
      </div>

      <a class="ask-me" href="https://backend-production-5fb5.up.railway.app/" target="_blank" rel="noopener noreferrer">Ask me.</a>
    </div>
  </main>

<script>
(function(){
  var SLIDE_MS = 4000;
  var ROLL_MS = 620; // must match --roll-ms in CSS
  var REAL_TOTAL = 4;   // distinct slides
  var TRACK_ITEMS = 5;  // + 1 clone of slide 1, appended at the end
  var index = 0;
  var headlineTrack = document.getElementById('headlineTrack');
  var bubblesTrack = document.getElementById('bubblesTrack');
  var headlineSlides = headlineTrack.children;
  var bubbleSlides = bubblesTrack.children;

  function setTransform(pct){
    var value = 'translateX(' + pct + '%)';
    headlineTrack.style.transform = value;
    bubblesTrack.style.transform = value;
  }

  function updateAriaHidden(){
    var activeIndex = index % REAL_TOTAL;
    for (var i = 0; i < REAL_TOTAL; i++){
      var active = (i === activeIndex);
      headlineSlides[i].setAttribute('aria-hidden', active ? 'false' : 'true');
      bubbleSlides[i].setAttribute('aria-hidden', active ? 'false' : 'true');
    }
  }

  function render(){
    // percentage is relative to the track's OWN width (500%), so one
    // slide-step is 100/TRACK_ITEMS percent of that. index only ever
    // increases -- it never wraps back to 0 via modulo -- so the track
    // always moves the same direction, one slide's-width per step.
    setTransform(index * (-100 / TRACK_ITEMS));
    updateAriaHidden();
  }

  function advance(){
    index++;
    render();
    if (index === REAL_TOTAL){
      // just landed on the clone (position 5), which is pixel-identical
      // to slide 1 (position 1). Once that transition settles, jump the
      // index back to 0 with transitions off for one frame -- an
      // invisible reset, since the clone and the real slide 1 look the
      // same -- so the next advance() keeps sliding the same direction
      // instead of snapping backward through the whole track.
      window.setTimeout(function(){
        headlineTrack.style.transition = 'none';
        bubblesTrack.style.transition = 'none';
        index = 0;
        setTransform(0);
        void headlineTrack.offsetWidth; // force reflow before re-enabling
        headlineTrack.style.transition = '';
        bubblesTrack.style.transition = '';
      }, ROLL_MS);
    }
  }

  render();
  // Always auto-advance -- reduced-motion strips the CSS transition (see
  // the transition rules above), so content still cycles, it just cuts
  // instantly instead of sliding, rather than freezing on slide 1 forever.
  setInterval(advance, SLIDE_MS);
})();
</script>
</body>
</html>
